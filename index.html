<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E6EBE8">
<title>Ola Saathi Prototype</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E7A5F'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M3 16.5V10c0-2.8 2.2-5 5-5h6.5l3.5 5.5h1.5a1.5 1.5 0 011.5 1.5v4.5'/%3E%3Cpath d='M3 16.5h18'/%3E%3Cpath d='M12.5 5v5.5h5.5'/%3E%3Ccircle cx='7' cy='17.5' r='2' fill='%23fff'/%3E%3Ccircle cx='18' cy='17.5' r='2' fill='%23fff'/%3E%3C/g%3E%3C/svg%3E">
<meta name="description" content="Clickable concept prototype of Ola Saathi: set your commute once, and pooled electric autos timed to the metro get you there every day. Made for an APM assignment; not an Ola product.">
<style>
:root{
  --brand:#0E7A5F;--brand-2:#12A07A;--brand-soft:#E3F3EE;--brand-dark:#0A5A46;
  --ink:#0F1F19;--muted:#5D6B66;--line:#E2E8E5;--bg:#F3F6F4;--card:#FFFFFF;--page:#E6EBE8;
  --amber:#A35F00;--amber-soft:#FFF3DA;--red:#D3362B;--red-soft:#FDECEA;
  --metro:#D7263D;--metro-soft:#FDE7EA;--blue:#2563EB;--blue-soft:#E8F0FE;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--page);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
svg{flex:none}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding:20px}

/* ---------- guide ---------- */
.guide{width:340px;max-height:min(844px,calc(100vh - 40px));overflow:auto;background:#fff;border-radius:20px;padding:20px 20px 16px;box-shadow:0 10px 30px rgba(15,31,25,.08);scrollbar-width:thin}
.g-head{display:flex;gap:12px;align-items:center}
.g-mark{width:40px;height:40px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.guide h1{font-size:19px;line-height:1.2}
.guide .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.g-intro{font-size:13px;color:#33433D;line-height:1.45;margin:12px 0}
.guide h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 6px}
.modes{display:flex;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.modes button{flex:1;padding:8px 6px;border-radius:9px;font-size:13.5px;font-weight:650;color:var(--muted);text-align:center}
.modes button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.scenes{display:flex;flex-direction:column;gap:5px}
.scenes button{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:8px 10px;border-radius:12px;border:1px solid var(--line);font-size:13.5px;line-height:1.3;font-weight:650}
.scenes button:hover{background:var(--bg)}
.scenes button.on{border-color:var(--brand);background:var(--brand-soft)}
.scenes .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.scenes button.on .n{background:var(--brand);color:#fff}
.scenes small{display:block;color:var(--muted);font-size:12px;font-weight:400;margin-top:2px}
.g-note{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:14px;padding:10px 12px;background:var(--bg);border-radius:12px}
.g-note b{color:var(--ink)}
.g-credit{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.4}
.g-restart{margin-top:8px;font-size:13px;color:var(--brand);font-weight:700}
.guide-fab{display:none;position:fixed;right:10px;top:max(8px,env(safe-area-inset-top));z-index:60;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.guide-overlay{display:none;position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.4);align-items:flex-end}
.guide-overlay.show{display:flex}
.guide-overlay .guide{width:100%;max-height:86vh;border-radius:20px 20px 0 0}

/* ---------- device ---------- */
.device{width:390px;height:min(844px,calc(100vh - 40px));min-height:640px;border-radius:52px;background:#111;padding:10px;box-shadow:0 30px 60px rgba(15,31,25,.25),inset 0 0 0 2px #2a2a2a;flex:none}
.screen{position:relative;width:100%;height:100%;border-radius:43px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.screen.dark{background:#1C4A3E}
.statusbar{height:46px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:6px 28px 0 34px;font-size:14px;font-weight:650;position:relative;z-index:12}
.screen.dark .statusbar{color:#fff}
.statusbar .notch{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:112px;height:30px;background:#111;border-radius:20px}
.statusbar .icons{display:flex;gap:6px;align-items:center}
.view{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.page-wrap{min-height:100%}
.page-wrap.enter{animation:in .26s ease}
@keyframes in{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
.tabbar{flex:none;height:74px;display:flex;border-top:1px solid var(--line);background:#fff;padding:7px 6px 16px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;color:#93A19B}
.tabbar button.on{color:var(--brand)}
.tabbar svg{width:22px;height:22px}
.hidden{display:none!important}

/* ---------- common ---------- */
.page{padding:4px 18px 28px}
.top{display:flex;align-items:center;gap:10px;padding:6px 0 12px}
.top h2{font-size:18px;font-weight:750}
.stepn{margin-left:auto;font-size:12.5px;color:var(--muted);font-weight:600}
.back{width:36px;height:36px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.08);flex:none}
.h1{font-size:24px;line-height:1.2;font-weight:780}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.center{text-align:center}
.grow{flex:1;min-width:0}
.ml-auto{margin-left:auto}
.mt2{margin-top:2px}.mt4{margin-top:4px}.mt8{margin-top:8px}.mt10{margin-top:10px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.label{font-weight:700;margin:16px 0 8px;font-size:14.5px}
.card{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(15,31,25,.05);margin-bottom:12px}
button.card{display:flex;width:100%;text-align:left}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.g6{gap:6px}
.big{font-size:20px;display:block;line-height:1.25}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px 16px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:15.5px;text-align:center}
.btn:active{transform:scale(.99)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--red)}
.btn.white{background:#fff;color:#0A5A46}
.btn.glassbtn{background:rgba(255,255,255,.16);color:#fff}
.btn.sm{padding:10px 12px;font-size:14px;border-radius:12px}
.btn.auto{width:auto}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn+.btn{margin-top:10px}
.btns{display:flex;gap:8px}
.btns .btn{margin-top:0}
.btn.sticky{position:sticky;bottom:14px;box-shadow:0 8px 20px rgba(14,122,95,.35);z-index:3}
.link{color:var(--brand);font-weight:700;font-size:13px;margin-top:10px;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;font-size:12.5px;font-weight:650;background:var(--bg);color:var(--ink);white-space:nowrap}
.chip.green{background:var(--brand-soft);color:var(--brand-dark)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.metro{background:var(--metro-soft);color:var(--metro)}
.chip.glass{background:rgba(255,255,255,.18);color:#fff}
.pill-demo{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:750;color:var(--blue);background:var(--blue-soft);border-radius:999px;padding:5px 9px;flex:none}
.field{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.field:focus-within{border-color:var(--brand)}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.field input{border:0;outline:0;width:100%;font-size:15px;font-weight:600;background:transparent}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{padding:9px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);font-weight:650;font-size:14px}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.days button{width:40px;height:40px;padding:0;border-radius:50%;text-align:center}
.toggle{position:relative;display:block;width:46px;height:28px;border-radius:999px;background:#C9D3CE;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:var(--brand)}
.toggle.on::after{left:21px}
.pref{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.pref:last-child{border-bottom:0}
.pref.np{padding-top:0}
.pref .t{flex:1}
.pref b{display:block;font-size:14.5px;margin-bottom:2px}
.pref span{font-size:12.5px;color:var(--muted);line-height:1.35;display:block}
.steps{display:flex;gap:6px;margin:0 0 12px}
.steps i{flex:1;height:4px;border-radius:4px;background:#D5DED9}
.steps i.on{background:var(--brand)}
.hello{padding:8px 0 12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--brand-soft);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;font-size:14px}
.avatar.lg{width:56px;height:56px;font-size:18px}
.banner{border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px;line-height:1.4}
.banner svg{margin-top:2px}
.banner.green{background:var(--brand-soft);color:var(--brand-dark)}
.banner.amber{background:var(--amber-soft);color:#6E4100}
.banner.blue{background:var(--blue-soft);color:#173E9C}
.banner b{display:block}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv b.r{text-align:right}
.kv.total{font-weight:800;font-size:15px;border-bottom:0;padding-top:10px}
.free{color:var(--brand)}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.compare div{border-radius:12px;padding:10px;background:var(--bg);font-size:12px;color:var(--muted)}
.compare div b{display:block;font-size:15px;color:var(--ink);margin-top:2px}
.compare div small{display:block;margin-top:2px}
.compare div.good{background:var(--brand-soft)}
.radio{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:14px;margin-bottom:8px;text-align:left;width:100%;background:#fff}
.radio.on{border-color:var(--brand);background:#F4FBF8}
.radio .dot{width:20px;height:20px;border-radius:50%;border:2px solid #B8C5BF;flex:none;margin-top:1px;position:relative}
.radio.on .dot{border-color:var(--brand)}
.radio.on .dot::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--brand)}
.radio b{display:block;font-size:14.5px}
.radio span span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px;line-height:1.35}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-ic{width:56px;height:56px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--brand)}
.empty-ic svg{width:26px;height:26px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty p{font-size:13.5px;line-height:1.45}

/* welcome */
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:44px;height:44px;border-radius:13px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.logo b{font-size:22px;letter-spacing:-.3px}
.logo small{display:block;font-size:12px;color:var(--muted);font-weight:650;margin-top:-2px}
.hero{font-size:29px;margin:30px 0 10px}
.lead{color:var(--muted);font-size:15px;line-height:1.5}
.feat{display:flex;gap:12px;align-items:flex-start;padding:7px 0}
.fi{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand-dark);display:flex;align-items:center;justify-content:center;flex:none}
.ft b{display:block;font-size:14.5px}
.ft span{font-size:12.5px;color:var(--muted)}
.fine{font-size:11.5px;color:var(--muted);text-align:center;margin-top:14px}

/* home cards */
.hero-card{background:linear-gradient(140deg,#0E7A5F,#0A5A46);color:#fff}
.hero-card.night{background:linear-gradient(140deg,#24345A,#111C33)}
.o85{opacity:.85}.o75{opacity:.75}
.hc-sub{margin-top:12px;font-size:13px;opacity:.85}
.hc-big{font-size:25px;font-weight:800;margin:2px 0}
.hc-line{font-size:13px;opacity:.9;line-height:1.4}
.hc-chain{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:12px;font-weight:700;flex-wrap:wrap}
.hc-chain span{background:rgba(255,255,255,.14);padding:4px 7px;border-radius:8px}
.hc-chain i{width:6px;height:2px;background:rgba(255,255,255,.5)}
.card.demo{align-items:center;gap:12px;border:1.5px dashed #B9CDEB;background:#F7FAFF;box-shadow:none}
.dm b{display:block;font-size:14px}
.dm span{font-size:12.5px;color:var(--muted)}
.ic-ok,.ic-late{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.ic-ok{background:var(--brand-soft);color:var(--brand)}
.ic-late{background:var(--amber-soft);color:var(--amber)}
.passcard{background:linear-gradient(140deg,#0F1F19,#16362C);color:#fff}
.pc-route{font-size:16.5px;display:block;margin-top:2px;line-height:1.35}
.prof{padding:10px 0 14px}
.pn{font-size:18px}

/* timeline */
.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:12px;width:2px;background:var(--line)}
.leg{position:relative;padding:3px 0 12px}
.leg:last-child{padding-bottom:0}
.leg::before{content:"";position:absolute;left:-21px;top:5px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--brand)}
.leg.metro::before{border-color:var(--metro)}
.leg.alert::before{border-color:var(--amber)}
.leg.end::before{background:var(--brand)}
.leg .time{font-size:12.5px;font-weight:700;color:var(--muted)}
.leg b{font-size:14.5px}
.leg .meta{font-size:12.5px;color:var(--muted)}
.chain{display:flex;align-items:center;margin-top:10px}
.chain i{flex:1;height:2px;background:var(--line);margin:0 4px}
.ch{text-align:center}
.ch b{display:block;font-size:13.5px}
.ch span{font-size:11.5px;color:var(--muted)}
.ch.on b{color:var(--brand)}

/* map */
.mapbox{position:relative;border-radius:18px;overflow:hidden;background:#EEF2EF;margin-bottom:12px}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .eta{position:absolute;left:12px;top:12px;background:#fff;border-radius:12px;padding:7px 12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.mapbox .eta b{font-size:20px;display:block;line-height:1.1}
.mapbox .eta span{font-size:11.5px;color:var(--muted)}
.mapbox .eta.bl{top:auto;bottom:12px}
.pref span.pill-demo{display:inline-flex;color:var(--blue);font-size:11px;margin:0 6px 0 0;vertical-align:1px}

/* seats */
.seats{display:flex;gap:8px;margin-top:12px}
.seatb{flex:1;border-radius:12px;padding:8px 6px;background:var(--bg);text-align:center;font-size:11.5px;color:var(--muted);line-height:1.25}
.seatb b{display:block;font-size:13px;color:var(--ink)}
.seatb.me{background:var(--brand);color:#D8F0E7}
.seatb.me b{color:#fff}
.seatb.in{background:var(--brand-soft);color:var(--brand-dark)}
.seatb.in b{color:var(--brand-dark)}
.seatb.wait{background:#fff;border:1.5px dashed #B8C5BF}
.code{font-size:32px;font-weight:800;letter-spacing:8px;text-align:center;padding:8px;background:var(--bg);border-radius:12px;margin:8px 0 10px}

/* rating */
.stars{display:flex;gap:6px}
.stars button{font-size:30px;line-height:1;color:#CDD6D1}
.stars button.on{color:#F2B01E}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tags button{padding:7px 11px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:650;background:#fff}
.tags button.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-dark)}

/* metro */
.progress{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;width:0;background:var(--brand);border-radius:6px}
.qr{width:160px;height:160px;margin:6px auto 8px;display:block}
.ticket{border:1px dashed #E6B3BB;background:#FFF7F8}
.stations{display:flex;align-items:center;margin:10px 0 4px}
.stations i{flex:1;height:4px;background:#F2C7CD}
.stations i.done{background:var(--metro)}
.stations b{width:10px;height:10px;border-radius:50%;background:#F2C7CD;flex:none}
.stations b.done{background:var(--metro)}

/* lock + alarm */
.lock{position:absolute;inset:0;background:linear-gradient(170deg,#1C4A3E 0%,#10261F 60%,#0A1813 100%);color:#fff;display:flex;flex-direction:column;align-items:center;padding:36px 14px 26px}
.lk-time{font-size:78px;font-weight:300;letter-spacing:-1px;line-height:1}
.lk-date{font-size:16px;opacity:.85;margin-top:6px}
.notifs{width:100%;margin-top:30px;display:flex;flex-direction:column;gap:8px}
.notif{width:100%;background:rgba(255,255,255,.14);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:20px;padding:12px 14px;text-align:left;color:#fff;animation:drop .45s ease}
.notif.hot{background:rgba(255,255,255,.25)}
@keyframes drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
.notif .app{display:flex;align-items:center;gap:8px;font-size:12px;opacity:.85;margin-bottom:5px}
.notif .app i{width:20px;height:20px;border-radius:6px;background:var(--brand-2);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:800}
.notif b{font-size:15px;display:block;margin-bottom:2px}
.notif p{font-size:13.5px;opacity:.92;line-height:1.35}
.lk-hint{margin-top:auto;font-size:12.5px;opacity:.7}
.alarm{position:absolute;inset:0;background:linear-gradient(180deg,#1C4A3E,#0C2A22);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 24px 28px}
.ring{width:148px;height:148px;border-radius:50%;background:rgba(18,160,122,.22);display:flex;align-items:center;justify-content:center;animation:pulse 1.2s ease-in-out infinite;margin-bottom:22px}
.ring div{width:102px;height:102px;border-radius:50%;background:var(--brand-2);display:flex;align-items:center;justify-content:center;animation:wiggle 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-10deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
.al-time{font-size:54px;font-weight:300;line-height:1}
.alarm h3{font-size:23px;margin:10px 0 6px}
.alarm p{opacity:.88;font-size:14.5px;line-height:1.45;margin-bottom:24px;max-width:300px}
.btn.light{background:#fff;color:#0A5A46}
.btn.outline{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45)}
.al-note{font-size:12px;opacity:.7;margin-top:16px;max-width:280px;line-height:1.4}

/* sheet + toast */
.sheet-wrap{position:absolute;inset:0;background:rgba(10,20,16,.38);display:none;align-items:flex-end;z-index:20}
.sheet-wrap.show{display:flex}
.sheet{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:16px 18px 26px;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:#D5DED9;margin:0 auto 12px}
.sh-title{font-size:17px;display:block;margin-bottom:4px}
.sheet p{line-height:1.4}
.toast{position:absolute;left:14px;right:14px;top:50px;background:var(--ink);color:#fff;border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.35;z-index:30;opacity:0;transform:translateY(-10px);transition:.25s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.toast.show{opacity:1;transform:none}

/* driver */
.dep{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dep:last-child{border-bottom:0}
.dep .tm{width:40px;font-weight:800;font-size:14px}
.dep.done .tm{color:var(--muted)}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:50%;background:#D5DED9}
.dots i.on{background:var(--brand)}
.next{border:1.5px solid var(--brand);background:#F4FBF8}
.next.ok{border-color:var(--brand);background:var(--brand-soft)}
.stop{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.stop:last-child{border-bottom:0}
.stop b{font-size:14px}
.seat{width:30px;height:30px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.seat.ok{background:var(--brand);color:#fff}
.seat.warn{background:var(--amber-soft);color:var(--amber)}
.seat.metro{background:var(--metro-soft);color:var(--metro)}
.list-item{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.codebox{display:flex;gap:10px;justify-content:center;margin:14px 0 6px}
.codebox span{width:48px;height:56px;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800}
.codebox span.f{border-color:var(--brand)}
.codebox.err span{border-color:var(--red);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.keypad button{padding:12px 0;border-radius:12px;background:var(--bg);font-size:20px;font-weight:700;text-align:center}
.keypad button:active{background:var(--line)}
.earn{font-size:30px;display:block;margin:2px 0}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin:26px 0 22px}
.bars div{flex:1;background:var(--brand-soft);border-radius:8px 8px 3px 3px;position:relative}
.bars div:nth-child(5){background:var(--brand)}
.bars em{position:absolute;top:-17px;left:-4px;right:-4px;text-align:center;font-size:10.5px;font-style:normal;color:var(--muted)}
.bars span{position:absolute;bottom:-19px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted)}

@media (max-width:820px){
  .stage{padding:0;gap:0;display:block}
  .stage>.guide{display:none}
  .device{width:100%;height:100vh;height:100dvh;min-height:0;border-radius:0;padding:0;box-shadow:none;background:var(--bg)}
  .screen{border-radius:0}
  .statusbar{padding:4px 16px 0 20px;height:42px}
  .statusbar .notch,.statusbar .icons{display:none}
  .guide-fab{display:block}
}
@media (prefers-reduced-motion:reduce){
  .ring,.ring div,.page-wrap.enter,.notif,.sheet{animation:none}
}

<body>

        <svg width="26" height="13" viewBox="0 0 26 13"><rect x=".5" y=".5" width="22" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="16" height="9" rx="2" fill="currentColor"/><rect x="23.5" y="4" width="2" height="5" rx="1" fill="currentColor" opacity=".5"/></svg>

<script>
'use strict';
/* ======================= constants and icons ======================= */
const BRAND = '#0E7A5F', METRO = '#D7263D', INK = '#0F1F19', BLUE = '#2563EB', FONT = 'Segoe UI,Roboto,Arial,sans-serif';
const DAYN = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const AUTO_PATH = '<path d="M3 16.5V10c0-2.8 2.2-5 5-5h6.5l3.5 5.5h1.5a1.5 1.5 0 011.5 1.5v4.5"/><path d="M3 16.5h18"/><path d="M12.5 5v5.5h5.5"/>';
const autoIcon = (size, color) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">${AUTO_PATH}<circle cx="7" cy="17.5" r="2" fill="${color}"/><circle cx="18" cy="17.5" r="2" fill="${color}"/></svg>`;
const I = {
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>',

  phone:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/></svg>',
  bell:'<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9a6 6 0 1112 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9"/><path d="M10 20a2 2 0 004 0"/></svg>',
  clock:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  check:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  battery:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="18" height="10" rx="2"/><rect x="4" y="9" width="11" height="6" rx="1" fill="currentColor"/><path d="M22 10v4"/></svg>',
  users:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.8a3.5 3.5 0 010 6.4M18 14.8c1.8.7 3 2.5 3.5 5.2"/></svg>',
  train:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14"/><path d="M8 21l2-4M16 21l-2-4"/></svg>',
  moon:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/></svg>',
  done:'<svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="#E3F3EE"/><circle cx="28" cy="28" r="20" fill="#0E7A5F"/><path d="M19 28.5l6 6 12-12.5" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  lateBig:'<svg width="56" height="56" viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="#FFF3DA"/><circle cx="28" cy="28" r="20" fill="#B86E00"/><path d="M28 18v11l7 4" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></svg>'
};

/* ======================= state ======================= */
const S0 = () => ({
  mode:'rider', screen:'welcome', phase:'sun',
  prefs:{ womenOnly:true, alarm:true, share:true, arrive:'9:30', days:[1,2,3,4,5,6],
    home:'Shanti Apartments, Ketkipada, Dahisar East', work:'Akruti Trade Centre, MIDC, Andheri East' },
  pay:'trip', autopilot:true, skipNext:false,
  snoozes:0, rebooked:false, late:false, todaySkipped:false, lock:null,
  rating:0, tags:[], tomorrow:null, credit:0, tripDone:false,
  eveTime:'9:00', nightArrived:false, nightDone:false, nightRating:0,
  d:{ stage:1, boarded:{ meena:true, priya:false, anita:false }, car:[150,80], moving:false, done:false, noshow:null, waiting:false, code:'', codeFor:null }
});
let S = S0();

/* ======================= helpers ======================= */
const $ = (s, el = document) => el.querySelector(s);
const view = $('#view'), screenEl = $('#screen');
let timers = [];
function later(fn, ms){ const id = setTimeout(fn, ms); timers.push(['t', id]); return id; }
function every(fn, ms){ const id = setInterval(fn, ms); timers.push(['i', id]); return id; }
function clearTimers(){ timers.forEach(([k, id]) => k === 't' ? clearTimeout(id) : k === 'i' ? clearInterval(id) : cancelAnimationFrame(id)); timers = []; }
function toast(msg, ms = 3000){ const el = $('#toast'); el.innerHTML = msg; el.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('show'), ms); }
function sheet(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#sheetWrap').classList.add('show'); }
function closeSheet(){ $('#sheetWrap').classList.remove('show'); }
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const firstPart = s => String(s).split(',')[0];
function fmt(m){ m = ((m % 1440) + 1440) % 1440; let h = Math.floor(m / 60); const mm = m % 60, ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + ':' + String(mm).padStart(2, '0') + ' ' + ap; }
const hm = m => fmt(m).slice(0, -3);
const off = () => S.prefs.arrive === '9:00' ? -30 : S.prefs.arrive === '10:00' ? 30 : 0;
const R = () => S.rebooked ? 8 : 0;                 // next Saathi is timed to the next train, 8 minutes later
const PL = m => fmt(m + off()), pl = m => hm(m + off());                 // planned times
const TR = m => fmt(m + off() + R()), tr = m => hm(m + off() + R());     // today's live trip
const eveShift = () => S.eveTime === '8:45' ? -15 : S.eveTime === '9:15' ? 15 : 0;
const E = m => fmt(1260 + eveShift() + m);
const tog = on => `<span class="toggle ${on ? 'on' : ''}"></span>`;
function nextDay(after){ const ds = [...S.prefs.days].sort((a, b) => a - b); for(const d of ds) if(d > after) return d; return ds.length ? ds[0] + 7 : after + 1; }
function cday(){ let d = nextDay(0); if(S.skipNext) d = nextDay(d); return d; }
const dayName = d => DAYN[(d - 1) % 7];
const dayDate = d => (d + 3) + ' October';
const dayLabel = d => dayName(d) + ', ' + dayDate(d);
function daysLabel(){ const ds = [...S.prefs.days].sort((a, b) => a - b), k = ds.join(''); return k === '123456' ? 'Monday to Saturday' : k === '12345' ? 'Monday to Friday' : k === '1234567' ? 'every day' : !k ? 'no days picked' : ds.map(d => DAYS[d - 1]).join(', '); }
const arrBase = () => 564 + (S.late ? 7 : 0);
const minsVsTarget = () => arrBase() + R() - 570;
const banner = (cls, icon, title, body) => `<div class="banner ${cls}">${icon}<div><b>${title}</b>${body}</div></div>`;
const setBanner = (id, ...a) => { const el = document.getElementById(id); if(el) el.innerHTML = banner(...a); };
const seat = (cls, a, b) => `<div class="seatb ${cls}"><b>${a}</b>${b}</div>`;
const coRiders = () => S.prefs.womenOnly ? `<span class="chip green">${I.shield} Women-only ride</span><span class="small muted">Your co-riders are verified women</span>` : `<span class="chip">${I.users} 2 verified co-riders</span>`;
function setStatus(txt){ $('#sbTime').textContent = txt; }

/* ======================= maps ======================= */
function baseMap(night){
  const bg = night ? '#15241F' : '#EEF2EF', blk = night ? '#1E312A' : '#E1E7E3', park = night ? '#1B3A2E' : '#D6EAD9', road = night ? '#2C4139' : '#FFFFFF';
  const xs = [[10, 70], [104, 72], [200, 56], [280, 70]], ys = [[10, 58], [92, 52], [168, 36]];
  let b = '';
  ys.forEach(([y, h]) => xs.forEach(([x, w]) => { b += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="${blk}"/>`; }));
  return `<rect width="360" height="210" fill="${bg}"/>${b}<rect x="104" y="92" width="72" height="52" rx="7" fill="${park}"/>
  <g stroke="${road}" stroke-width="11" stroke-linecap="round" fill="none"><path d="M-5 80H365"/><path d="M-5 156H365"/><path d="M92 -5V215"/><path d="M188 -5V215"/><path d="M268 -5V215"/></g>`;
}
const routeLine = (d, color, dashed) => `<path d="${d}" fill="none" stroke="${color || BRAND}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"${dashed ? ' stroke-dasharray="2 9"' : ''}/>`;
const carMarker = (x, y, bg) => `<g id="car" transform="translate(${x},${y})"><circle r="16" fill="${bg || BRAND}" stroke="#fff" stroke-width="3"/><svg x="-10" y="-10.5" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round">${AUTO_PATH}<circle cx="7" cy="17.5" r="2" fill="#fff"/><circle cx="18" cy="17.5" r="2" fill="#fff"/></svg></g>`;
const metroPin = (x, y) => `<g transform="translate(${x},${y})"><circle r="11" fill="${METRO}" stroke="#fff" stroke-width="3"/><text y="4" font-size="10" font-weight="800" fill="#fff" text-anchor="middle" font-family="${FONT}">M</text></g>`;
const dotPin = (x, y, color, n) => `<g transform="translate(${x},${y})"><circle r="${n ? 10 : 7}" fill="#fff" stroke="${color}" stroke-width="3.5"/>${n ? `<text y="4" font-size="10" font-weight="800" text-anchor="middle" fill="${color}" font-family="${FONT}">${n}</text>` : ''}</g>`;
const label = (x, y, txt, color, anchor, halo) => `<text x="${x}" y="${y}" font-size="11" font-weight="700" fill="${color || INK}" text-anchor="${anchor || 'middle'}" font-family="${FONT}" paint-order="stroke" stroke="${halo || '#fff'}" stroke-width="3" stroke-linejoin="round">${txt}</text>`;
const PTS = {
  pickup: [[30, 156], [92, 156], [92, 80], [232, 80]],
  ride: [[60, 80], [188, 80], [188, 156], [330, 156]],
  last: [[40, 80], [92, 80], [92, 156], [268, 156], [268, 186]],
  approach: [[340, 80], [40, 80]],
  night: [[330, 80], [188, 80], [188, 156], [60, 156]],
  d23: [[150, 80], [268, 80], [268, 118]],
  d3m: [[268, 118], [268, 156], [330, 156]]
};
function mapSVG(kind){
  let s = '';
  if(kind === 'pickup'){
    s = baseMap() + routeLine('M30 156H92V80H232', BRAND, true)
      + `<circle cx="232" cy="50" r="12" fill="${BLUE}" opacity=".15"><animate attributeName="r" values="9;18;9" dur="2s" repeatCount="indefinite"/></circle><circle cx="232" cy="50" r="6.5" fill="${BLUE}" stroke="#fff" stroke-width="2.5"/>`
      + label(254, 54, 'You', BLUE, 'start') + dotPin(232, 80, BRAND) + label(232, 106, 'Your gate', '#0A5A46') + label(30, 186, 'From Ketkipada', '#5D6B66', 'start')
      + carMarker(30, 156);
  } else if(kind === 'ride'){
    s = baseMap() + routeLine('M60 80H188V156H330') + dotPin(60, 80, '#93A19B') + label(60, 62, 'Your gate', '#5D6B66')
      + dotPin(188, 118, BRAND) + label(200, 122, 'Rawalpada', '#0A5A46', 'start')
      + metroPin(330, 156) + label(350, 188, 'Dahisar (E) Metro', '#8A1F2B', 'end') + carMarker(60, 80);
  } else if(kind === 'last'){
    s = baseMap() + (S.late ? routeLine('M340 80H40', '#C77D00', true) : '') + routeLine('M40 80H92V156H268V186')
      + metroPin(40, 80) + label(14, 62, 'Gundavali, Gate 2', '#8A1F2B', 'start')
      + `<rect x="258" y="176" width="20" height="20" rx="5" fill="${INK}"/>` + label(286, 190, 'Office', INK, 'start')
      + carMarker(S.late ? 340 : 40, 80);
  } else if(kind === 'night'){
    s = baseMap(true) + routeLine('M330 80H188V156H60', '#12A07A') + metroPin(330, 80) + label(350, 62, 'Dahisar (E)', '#FFC2CA', 'end', '#15241F')
      + dotPin(60, 156, '#12A07A') + label(60, 188, 'Your gate', '#D8F0E7', 'middle', '#15241F') + carMarker(330, 80, '#12A07A');
  } else if(kind === 'driver' || kind === 'driverPre'){
    const pre = kind === 'driverPre', car = pre ? DSTOPS[0].pt : S.d.car;
    s = baseMap() + routeLine('M40 156H92V80H268V156H330')
      + DSTOPS.map((st, i) => dotPin(st.pt[0], st.pt[1], pre ? '#93A19B' : S.d.boarded[st.k] ? BRAND : S.d.noshow === st.k ? '#C77D00' : '#93A19B', String(i + 1))).join('')
      + metroPin(330, 156) + label(350, 188, 'Metro, Gate 1', '#8A1F2B', 'end')
      + carMarker(car[0], car[1], INK);
  }
  return `<svg viewBox="0 0 360 210" role="img" aria-label="Map">${s}</svg>`;
}
function along(pts, p){
  const seg = []; let tot = 0;
  for(let i = 1; i < pts.length; i++){ const d = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]); seg.push(d); tot += d; }
  let target = p * tot;
  for(let i = 0; i < seg.length; i++){
    if(target <= seg[i]){ const r = seg[i] ? target / seg[i] : 0; return [pts[i][0] + (pts[i+1][0] - pts[i][0]) * r, pts[i][1] + (pts[i+1][1] - pts[i][1]) * r]; }
    target -= seg[i];
  }
  return pts[pts.length - 1];
}
function animate(pts, ms, onStep, onDone){
  const el = document.getElementById('car'); if(!el) return;
  let start = null;
  const frame = ts => {
    if(!el.isConnected) return;
    if(start === null) start = ts;
    const p = Math.min(1, (ts - start) / ms);
    const [x, y] = along(pts, p);
    el.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)})`);
    if(onStep) onStep(p);
    if(p < 1) timers.push(['r', requestAnimationFrame(frame)]); else if(onDone) onDone();
  };
  timers.push(['r', requestAnimationFrame(frame)]);
}
function qr(seed){
  let s = seed; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const n = 25, c = 160 / n; let r = '';
  const finder = (x, y) => `<rect x="${x*c}" y="${y*c}" width="${7*c}" height="${7*c}" fill="#111"/><rect x="${(x+1)*c}" y="${(y+1)*c}" width="${5*c}" height="${5*c}" fill="#fff"/><rect x="${(x+2)*c}" y="${(y+2)*c}" width="${3*c}" height="${3*c}" fill="#111"/>`;
  for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
    if((x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9)) continue;
    if(rnd() > .52) r += `<rect x="${(x*c).toFixed(2)}" y="${(y*c).toFixed(2)}" width="${(c+.2).toFixed(2)}" height="${(c+.2).toFixed(2)}" fill="#111"/>`;
  }
  return `<svg class="qr" viewBox="0 0 160 160" aria-label="Ticket QR code (sample)"><rect width="160" height="160" fill="#fff"/>${r}${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}

const riderTabs = [['home', 'Home', I.home], ['trips', 'Trips', I.trips], ['pass', 'Pass', I.pass], ['profile', 'Profile', I.user]];
const driverTabs = [['dhome', 'Route', I.route], ['dearn', 'Earnings', I.wallet]];
function renderTabs(def){
  const tb = $('#tabbar');
  if(!def.tab){ tb.classList.add('hidden'); return; }
  tb.classList.remove('hidden');
  tb.innerHTML = (def.driver ? driverTabs : riderTabs).map(([k, l, ic]) => `<button class="${def.tab === k ? 'on' : ''}" data-go="${k}">${ic}<span>${l}</span></button>`).join('');
}
function paint(def, fresh){
  const keep = view.scrollTop;
  view.innerHTML = `<div class="page-wrap${fresh ? ' enter' : ''}">${def.html()}</div>`;
  view.scrollTop = fresh ? 0 : keep;
  setStatus(def.time());
  screenEl.classList.toggle('dark', !!def.dark);
  renderTabs(def);
}
function go(name){
  closeSheet(); clearTimers();
  clearTimeout(toast.h); $('#toast').classList.remove('show');
  const def = screens[name]; if(!def) return;
  if(name === 'lock' && !S.lock) S.lock = lockMorning();
  S.screen = name; S.mode = def.driver ? 'driver' : 'rider';
  paint(def, true);
  if(def.after) def.after();
  try{ history.replaceState(null, '', '#' + name); }catch(e){}
  renderGuide();
}
function syncInputs(){ const h = $('#inHome'), w = $('#inWork'); if(h && h.value.trim()) S.prefs.home = h.value.trim(); if(w && w.value.trim()) S.prefs.work = w.value.trim(); }
function rerender(){ syncInputs(); paint(screens[S.screen], false); renderGuide(); }
function resetMorning(){ Object.assign(S, { phase:'sun', snoozes:0, rebooked:false, late:false, tomorrow:null, tripDone:false, rating:0, tags:[], credit:0, lock:null, todaySkipped:false, nightArrived:false, nightDone:false }); }

/* ======================= driver flow helpers ======================= */
function renderCodeBox(){ const b = $('#codebox'); if(b) b.innerHTML = [0, 1, 2, 3].map(i => `<span class="${i < S.d.code.length ? 'f' : ''}">${S.d.code[i] || ''}</span>`).join(''); }
function dAdvance(){
  const D = S.d;
  if(D.stage === 1){
    D.moving = true; rerender();
    animate(PTS.d23, 3500, p => setStatus(pl(518 + Math.round(p * 3))), () => { D.car = [268, 118]; D.moving = false; D.stage = 2; rerender(); });
  } else if(D.stage === 2){ D.stage = 3; rerender(); }
}

/* ======================= actions ======================= */
const A = {
  arrive(b){ S.prefs.arrive = b.dataset.v; rerender(); },
  day(b){ syncInputs(); const v = +b.dataset.v; S.prefs.days = S.prefs.days.includes(v) ? S.prefs.days.filter(x => x !== v) : [...S.prefs.days, v].sort((a, c) => a - c); rerender(); },
  toSetup2(){ syncInputs(); if(!S.prefs.days.length){ toast('Pick at least one day.'); return; } go('setup2'); },
  pref(b){ const k = b.dataset.k; S.prefs[k] = !S.prefs[k]; rerender();
    if(k === 'womenOnly') toast(S.prefs.womenOnly ? 'Women-only rides on. You will share only with verified women.' : 'Women-only rides off. You will share with verified co-riders.');
    if(k === 'alarm' && !S.prefs.alarm) toast('Alarm off. You will still get a notification when it is time to leave.'); },
  pay(b){ S.pay = b.dataset.v; rerender(); },
  autopilotToggle(){ S.autopilot = !S.autopilot; rerender(); },
  startAutopilot(){ S.phase = 'sun'; go('home'); toast(S.autopilot ? `Autopilot is on. Your commute is booked ${daysLabel()}.` : `Booked for ${dayName(cday())}.`); },
  skipNext(){ const d = cday(); sheet(`<b class="sh-title">Skip ${dayName(d)}'s commute?</b><p class="muted small" style="margin-bottom:14px">Your seats go to other riders and autopilot books again from ${dayName(nextDay(d))}. No charge.</p><button class="btn" data-act="confirmSkip">Skip ${dayName(d)}</button><button class="btn ghost" data-act="closeSheet">Keep it</button>`); },
  confirmSkip(){ const d = dayName(cday()); S.skipNext = true; closeSheet(); rerender(); toast(`${d} skipped. No charge.`); },
  undoSkip(){ S.skipNext = false; rerender(); },
  changeTime(){ sheet(`<b class="sh-title">Reach office by</b><div class="seg" style="margin:12px 0 14px">${['9:00', '9:30', '10:00'].map(x => `<button class="${S.prefs.arrive === x ? 'on' : ''}" data-act="arriveSheet" data-v="${x}">${x} am</button>`).join('')}</div><p class="small muted">Saathi re-times every leg to the trains for you.</p>`); },
  arriveSheet(b){ S.prefs.arrive = b.dataset.v; closeSheet(); rerender(); toast(`Done. Every leg is re-timed so you reach by ${b.dataset.v} am.`); },
  closeSheet(){ closeSheet(); },
  morning(){ resetMorning(); S.lock = lockMorning(); go('lock'); },
  openLive(){ go('live'); },
  snooze(){
    if(S.snoozes === 0){ S.snoozes = 1; S.lock = { abs:513, next:'alarm', delay:1800, notes:[{ when:'now', title:`Snoozed until ${tr(514)}`, body:`Your Saathi still reaches your gate at ${TR(517)}.` }] }; go('lock'); return; }
    sheet(`<b class="sh-title">Snooze again and you'll miss this Saathi</b><p class="muted small" style="margin-bottom:14px">It reaches your gate at ${TR(517)} and can wait only 1 minute.</p>
      <button class="btn" data-act="rebook">Move me to the next Saathi</button><p class="small muted center mt4">Pick-up ${pl(525)}, train ${pl(538)}, office by ${PL(572)}</p>
      <button class="btn ghost mt12" data-act="leaving">I'm leaving now</button>`);
  },
  rebook(){ S.rebooked = true; S.snoozes = 0; S.lock = { abs:515, next:'alarm', delay:2600, notes:[{ when:'now', title:`Moved to the ${TR(517)} Saathi`, body:`Your earlier seat went to the next rider. We'll ring again at ${TR(512)}.` }] }; go('lock'); },
  leaving(){ go('live'); },
  skipToday(){ sheet(`<b class="sh-title">Skip today's commute?</b><p class="muted small" style="margin-bottom:14px">Your seats go to other riders. No charge.</p><button class="btn" data-act="confirmSkipToday">Skip today</button><button class="btn ghost" data-act="closeSheet">Go back</button>`); },
  confirmSkipToday(){ S.todaySkipped = true; S.phase = 'mon'; go('home'); toast('Today skipped. No charge.'); },
  shareTrip(){ toast('Live trip link sent to your emergency contact.'); },
  call(){ toast('Calling through a masked number. Neither of you sees the other\'s phone number.'); },
  sos(){ sheet(`<b class="sh-title" style="color:var(--red)">Send SOS?</b><p class="muted small" style="margin-bottom:14px">The Saathi safety team and your emergency contact get your live location, and the team calls you within 30 seconds.</p><button class="btn red" data-act="sosConfirm">Send SOS</button><button class="btn ghost" data-act="closeSheet">Cancel</button>`); },
  sosConfirm(){ closeSheet(); toast('Demo only: no alert was sent. In the real app the safety team calls you within 30 seconds.', 3800); },
  boarded(){ go('ride'); },
  lateToggle(){ S.late = !S.late; $('#lmCard').innerHTML = lmCard(); if(S.late) toast('Saathi alert: your last-mile auto is running 7 minutes late. That leg is now free.', 3600); },
  rideLast(b){
    b.disabled = true; b.textContent = 'On the way';
    const startM = S.late ? 565 : 558;
    animate(PTS.last, 7000, p => { setStatus(tr(startM + Math.round(p * 6))); }, () => { S.tripDone = true; if(S.late && S.pay === 'pass') S.credit = 20; go('summary'); });
  },
  rate(b){ S.rating = +b.dataset.v; rerender(); if(S.rating <= 3) toast('Thanks. Tell us what went wrong and we will look into it.'); },
  tag(b){ const v = b.dataset.v; S.tags = S.tags.includes(v) ? S.tags.filter(x => x !== v) : [...S.tags, v]; rerender(); },
  tomorrow(b){
    S.tomorrow = b.dataset.v;
    const nd = nextDay(cday());
    if(S.screen === 'summary') $('#tomorrowCard').innerHTML = tomorrowHTML(); else rerender();
    toast(S.tomorrow === 'yes' ? `Booked for ${dayName(nd)}. Same route, same time.` : `${dayName(nd)} skipped. Your seats went to other riders.`);
  },
  autopilotOn(){ S.autopilot = true; $('#tomorrowCard').innerHTML = tomorrowHTML(); toast(`Autopilot is on. Booked ${daysLabel()}.`); },
  summaryDone(){ S.phase = 'mon'; go('home'); },
  toEvening(){ go('evening'); },
  eveTime(b){ S.eveTime = b.dataset.v; rerender(); },
  startNight(){ S.nightArrived = false; go('night'); },
  nightRate(b){ S.nightRating = +b.dataset.v; $('#nightEnd').innerHTML = nightEnd(); },
  nightDone(){ S.nightDone = true; go('home'); },
  payPass(){ S.pay = 'pass'; rerender(); toast('Saathi Pass is on: ₹1,799 a month.'); },
  payTrip(){ S.pay = 'trip'; rerender(); toast('Back to paying per trip.'); },
  driverMode(){ go('dhome'); },
  riderMode(){ go('home'); },
  enterCode(b){
    const r = DSTOPS.find(x => x.k === b.dataset.k), first = r.name.split(' ')[0];
    S.d.codeFor = r.k; S.d.code = '';
    sheet(`<b class="sh-title">Enter ${first}'s code</b><p class="muted small">Ask for the 4-digit code on their phone. It confirms the right person is getting in.</p>
      <div class="codebox" id="codebox"></div><div class="small center" id="codeMsg" style="color:var(--red);min-height:18px"></div>
      <div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', 'del'].map(k => k ? `<button data-act="key" data-v="${k}" aria-label="${k === 'del' ? 'Delete' : k}">${k === 'del' ? '⌫' : k}</button>` : '<span></span>').join('')}</div>
      <p class="small muted center mt10">Demo: ${first}'s code is <b>${r.code}</b></p>`);
    renderCodeBox();
  },
  key(b){
    const D = S.d, v = b.dataset.v;
    if(D.code.length === 4) return;
    if(v === 'del') D.code = D.code.slice(0, -1); else D.code += v;
    renderCodeBox();
    if(D.code.length < 4) return;
    const r = DSTOPS.find(x => x.k === D.codeFor);
    if(D.code === r.code){
      setTimeout(() => { closeSheet(); D.boarded[r.k] = true; D.waiting = false; toast(`${r.name} is in. Seat ${r.seat}.`); dAdvance(); }, 250);
    } else {
      $('#codebox').classList.add('err'); $('#codeMsg').textContent = "That code doesn't match. Ask again.";
      setTimeout(() => { D.code = ''; renderCodeBox(); const cb = $('#codebox'); if(cb) cb.classList.remove('err'); }, 450);
    }
  },
  noShow(){
    S.d.waiting = true; rerender();
    let p = 0; const id = every(() => {
      p += 1 / 30; const bar = $('#waitBar'); if(bar) bar.style.width = Math.min(100, p * 100) + '%';
      if(p >= 1){ clearInterval(id); const lb = $('#leaveBtn'); if(lb) lb.disabled = false; }
    }, 200);
  },
  leaveWithout(){ const r = DSTOPS[S.d.stage]; S.d.noshow = r.k; S.d.waiting = false; toast(`Seat released. ${r.name} has been moved to the ${PL(533)} Saathi and told.`, 3600); dAdvance(); },
  startTrip(){
    const D = S.d; D.moving = true; rerender();
    animate(PTS.d3m, 4000, p => setStatus(pl(521 + Math.round(p * 5))), () => { D.car = [330, 156]; D.moving = false; D.stage = 4; D.done = true; rerender(); });
  },
  driverBack(){ go('dhome'); }
};

/* ======================= guide ======================= */
const SCENES = [
  { g:"Priya's morning", s:'setup1', t:'Set up the commute once', d:'Home, work, arrival time, days, safety options', f:() => { S = S0(); } },
  { s:'plan', t:'See the daily plan', d:'Saathi, Metro Line 7, Saathi: time and fare against today', f:() => {} },
  { s:'home', t:'Autopilot is on', d:'Tomorrow is booked; skip a day or change the time', f:() => { resetMorning(); } },
  { s:'lock', t:'Leave-now alarm', d:'Notification, then an alarm 5 minutes before pick-up', f:() => { resetMorning(); } },
  { s:'live', t:'Track the Saathi', d:'Moving map, countdown, seats, driver, share and SOS', f:() => { S.rebooked = false; S.snoozes = 0; } },
  { s:'ride', t:'Ride to the metro', d:'Live connection to the train, third rider picked up', f:() => { S.rebooked = false; } },
  { s:'metro', t:'Metro ticket in the app', d:'QR ticket, live stations, last-mile auto waiting', f:() => { S.rebooked = false; S.late = false; } },
  { s:'summary', t:'Fare and "same ride tomorrow?"', d:'Fare breakdown, rating, yes or no for tomorrow', f:() => { S.rebooked = false; S.late = false; S.tomorrow = null; } },
  { g:'When things go wrong', id:'late', s:'metro', t:'Last-mile auto runs late', d:'You are told early and that leg becomes free', f:() => { resetMorning(); S.late = true; } },
  { id:'snooze', s:'alarm', t:'Snooze too long', d:'Tap "Snooze again": Saathi moves you to the next auto', f:() => { resetMorning(); S.snoozes = 1; } },
  { g:'Night', s:'evening', t:'Ride home at night', d:'Women-only sharing, live trip for an emergency contact, drop at your gate', f:() => { resetMorning(); S.phase = 'mon'; S.tripDone = true; } },
  { g:'Driver app', s:'dhome', t:"Today's route and riders", d:'Departures timed to trains, riders booked, battery, earnings', f:() => {} },
  { s:'ddep', t:'Pick-ups and boarding codes', d:"Type the rider's code, handle a no-show, start the trip", f:() => { S.d = S0().d; } }
];
function sceneIndex(){
  const sc = S.screen;
  if(sc === 'setup1' || sc === 'setup2') return 0;
  if(sc === 'plan') return 1;
  if(sc === 'home') return S.phase === 'sun' ? 2 : -1;
  if(sc === 'lock' || sc === 'alarm') return S.snoozes > 0 || S.rebooked ? 9 : 3;
  if(sc === 'live' || sc === 'ride') return S.rebooked ? 9 : sc === 'live' ? 4 : 5;
  if(sc === 'metro' || sc === 'lastmile') return S.late ? 8 : 6;
  if(sc === 'summary') return S.late ? 8 : 7;
  if(sc === 'evening' || sc === 'night') return 10;
  if(sc === 'dhome' || sc === 'dearn') return 11;
  if(sc === 'ddep') return 12;
  return -1;
}
function renderGuide(){
  const cur = sceneIndex();
  let html = `<div class="g-head"><div class="g-mark">${I.auto}</div><div><h1>Ola Saathi</h1><div class="sub">Clickable prototype · Mumbai pilot on Metro Line 7</div></div></div>
  <p class="g-intro">Use it like a real app, or jump to any moment below. The rider is <b>Priya</b>, who goes from Dahisar East to MIDC, Andheri East. The driver is <b>Santosh</b> on route R12.</p>
  <div class="modes"><button class="${S.mode === 'rider' ? 'on' : ''}" data-gmode="rider">Rider app</button><button class="${S.mode === 'driver' ? 'on' : ''}" data-gmode="driver">Driver app</button></div>`;
  SCENES.forEach((sc, i) => {
    if(sc.g) html += (i ? '</div>' : '') + `<h2>${sc.g}</h2><div class="scenes">`;
    html += `<button data-gscene="${i}" class="${i === cur ? 'on' : ''}"><span class="n">${i + 1}</span><span>${sc.t}<small>${sc.d}</small></span></button>`;
  });
  html += `</div><div class="g-note"><b>Works for real:</b> every button and toggle, timers, moving maps, snooze and re-booking, the free leg when an auto is late, ratings, "same ride tomorrow" and the driver's code check. <b>Simulated:</b> payments, GPS, notifications, the metro QR, names and numbers.</div>
  <div class="g-credit">Concept prototype by Shivangi Pandita for the Ola Electric APM assignment. Not an Ola product.</div>
  <button class="g-restart" data-grestart="1">Restart from the beginning</button>`;
  $('#guide').innerHTML = html; $('#guideM').innerHTML = html;
}

/* ======================= events ======================= */
document.addEventListener('click', e => {
  const gs = e.target.closest('[data-gscene]');
  if(gs){ const sc = SCENES[+gs.dataset.gscene]; sc.f(); $('#guideOverlay').classList.remove('show'); go(sc.s); return; }
  const gm = e.target.closest('[data-gmode]');
  if(gm){ $('#guideOverlay').classList.remove('show'); go(gm.dataset.gmode === 'driver' ? 'dhome' : 'home'); return; }
  if(e.target.closest('[data-grestart]')){ S = S0(); $('#guideOverlay').classList.remove('show'); go('welcome'); return; }
  const g = e.target.closest('[data-go]');
  if(g){ e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest('[data-act]');
  if(a && A[a.dataset.act] && !a.disabled){ e.preventDefault(); A[a.dataset.act](a, e); }
});
$('#sheetWrap').addEventListener('click', e => { if(e.target.id === 'sheetWrap') closeSheet(); });
$('#guideFab').addEventListener('click', () => $('#guideOverlay').classList.add('show'));
$('#guideOverlay').addEventListener('click', e => { if(e.target.id === 'guideOverlay') $('#guideOverlay').classList.remove('show'); });
document.addEventListener('keydown', e => {
  if(!$('#codebox') || !$('#sheetWrap').classList.contains('show')) return;
  if(/^[0-9]$/.test(e.key)) A.key({ dataset:{ v:e.key } });
  else if(e.key === 'Backspace') A.key({ dataset:{ v:'del' } });
});

/* ======================= start ======================= */
(function start(){
  const h = (location.hash || '').slice(1);
  const sc = SCENES.find(x => x.id === h);
  if(sc){ sc.f(); go(sc.s); }
  else if(screens[h]) go(h);
  else go('welcome');
})();
</script>
